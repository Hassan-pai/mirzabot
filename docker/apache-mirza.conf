# docker/apache-mirza.conf   (__PORT__ is replaced at boot by entrypoint.sh)
# SPDX-License-Identifier: AGPL-3.0-or-later
<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # ---- never serve sensitive files over HTTP -------------------------
    <FilesMatch "(?i)^(config\.php|table\.php|install\.sh|composer\.(json|lock)|\.env.*|.*\.sql|.*\.log|error_log.*|version|Dockerfile|docker-compose\.yml|railway\.json)$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/var/www/html/(cronbot|docker|vendor|lang|\.git)">
        Require all denied
    </DirectoryMatch>

    # ---- basic security headers ----------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By
    ServerSignature Off

    # ---- Railway terminates TLS in front of the container --------------
    RemoteIPHeader X-Forwarded-For
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    # ---- OPTIONAL: accept webhook traffic only from Telegram ----------
    # Enable ONLY if you do not open /index.php in a browser.
    # <Location "/index.php">
    #     <RequireAny>
    #         Require ip 149.154.160.0/20
    #         Require ip 91.108.4.0/22
    #     </RequireAny>
    # </Location>

    ErrorLog /dev/stderr
    SetEnvIf Request_URI "^/health\.php$" dontlog
    CustomLog /dev/stdout combined env=!dontlog
</VirtualHost>
